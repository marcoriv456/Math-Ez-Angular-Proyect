<main>
  <home-introduction></home-introduction>

    <div class="text-container">
      <h3>Todo en un solo lugar</h3>
      <p>¡Calculadoras para cualquier tema! Desde algebra, calculo y trigonometria hasta lógica, grafos y estadistica.</p>
    </div>

    <div class="btn-container">
      <button class="calculus">
        <div class="img-container">
          <img src="/assets/global/icons/topics/calculus.svg" alt="">
        </div>
        <span>Calculo</span>
      </button>
      <button class="algebra">
        <div class="img-container">
          <img src="/assets/global/icons/topics/algebra.svg" alt="">
        </div>
        <span>Algebra</span>
      </button>
      <button class="graphics">
        <div class="img-container">
          <img src="/assets/global/icons/topics/graphics.svg" alt="">
        </div>

      </button>
      <button class="logic">
        <div class="img-container">
          <img src="/assets/global/icons/topics/logic.svg" alt="">
        </div>
        <span>Logica</span>
      </button>
      <button class="measures">
        <div class="img-container">
          <img src="/assets/global/icons/topics/measures.svg" alt="">
        </div>
        <span>Medidas</span>
      </button>
      <button class="trigonometry">
        <div class="img-container">
          <img src="/assets/global/icons/topics/trigonometry.svg" alt="">
        </div>
        <span>Trigonometria</span>
      </button>
      <button class="statistics">
        <div class="img-container">
          <img src="/assets/global/icons/topics/statistics.svg" alt="">
        </div>
        <span>Estadistica</span>
      </button>
    </div>
