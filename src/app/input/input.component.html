<div class="main-overlay" #overlay>
  <term-container
    [terms]="terms"
    [parent]="this"
  ></term-container>
  <div class="caret-overlay">
    <div
      #caret
      id="caret-container"
    >
      <span></span>
    </div>
  </div>
</div>

<div
  #warningContainer
  [@warning-animations]
  *ngIf="showingWarning"
  class="warning-container">
  <span
    *ngFor="let warning of warningMessages"
    [ngClass]="warning.type"
    class="warning-message"
  >
    {{warning.message}}
  </span>
</div>
