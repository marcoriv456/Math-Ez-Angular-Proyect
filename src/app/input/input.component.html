<ng-container *ngFor="let term of terms; let i=index">
  <char
    *ngIf="term.type=='char'"
    [char]="term.char"
    [inputTerm]="{char:term.char,index:i}"
  ></char>
  <frac
    #fractionComponent
    *ngIf="term.type=='fraction'"
    [index]="i"
    [inputTerm]="{char:'/',index:i,classRef:fractionComponent.numeratorComponent}"
    [numeratorChildren]="term.numeratorChildren"
    [denominatorChildren]="term.denominatorChildren"
  ></frac>
</ng-container>
<span
  #caret
  id="caret"
  [style.left]="caretPosition"
></span>
