<div class="main-overlay" #overlay>
  <editable-term-container
    [index]="0"
    [parent]="undefined"
    [terms]="terms"
  ></editable-term-container>
  <div class="caret-overlay">
    <div
      id="caret-container"
      [ngStyle]="caretStyleData"
    >
      <span></span>
    </div>
  </div>
</div>

<term-validation-warning></term-validation-warning>
<span
  [@advice-fading]
  class="insert-something-advice"
  *ngIf="terms.length==0"
>
  Inserta una operacion
</span>
