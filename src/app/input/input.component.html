<ng-container *ngFor="let term of terms; let i=index">
  <char
    *ngIf="term.type=='char'"
    [char]="term.char"
    [inputTerm]="{char:term.char,index:i,parent:this}"
  ></char>
  <frac
    #fractionComponent
    *ngIf="term.type=='fraction'"
    [numeratorChildren]="term.numeratorChildren"
    [denominatorChildren]="term.denominatorChildren"
    [index]="i"
    [inputTerm]="{char:'/',editableElementRef:fractionComponent,index:i,parent:this}"
    [parent]="this"
  ></frac>
  <exp
    #exponentComponent
    *ngIf="term.type=='exponent'"
    [inputTerm]="{char:'^',index:i,editableElementRef:exponentComponent,parent:this}"
    [index]="i"
    [terms]="term.exponentChildren"
    [parent]="this"
  ></exp>
  <root
    #rootComponent
    *ngIf="term.type=='root'"
    [terms]="term.rootChildren"
    [index]="i"
    [parent]="this"
    [inputTerm]="{char:'root',editableElementRef:rootComponent,index:i,parent:this}"
  ></root>
</ng-container>
<div
  #caret
  id="caret-container"
  [style.left]="caretPosition"
>
  <span></span>
</div>
