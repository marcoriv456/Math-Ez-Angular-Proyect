<ng-container *ngFor="let term of terms; let i=index">
  <char
    *ngIf="term.type=='char'"
    inputTerm
    [char]="term.char"
    [index]="i"
    [inputTermValidation]="CharValidator"
  ></char>
  <frac
    *ngIf="term.type=='fraction'"
    inputTerm
    [term]="term"
    [index]="i"
    [inputTermValidation]="FractionValidator"
  ></frac>
  <exp
    *ngIf="term.type=='exponent'"
    inputTerm
    [index]="i"
    [term]="term"
    [inputTermValidation]="ExponentValidator"
  ></exp>
  <root
    *ngIf="term.type=='root'"
    inputTerm
    [term]="term"
    [index]="i"
    [inputTermValidation]="RootValidator"
  ></root>
  <function
    *ngIf="term.type=='function'"
    inputTerm
    [term]="term"
    [index]="i"
    [inputTermValidation]="getFunctionValidator(term.functionName)"
  ></function>
  <parenthesis
    *ngIf="term.type=='parenthesis'"
    inputTerm
    [term]="term"
    [index]="i"
  ></parenthesis>
</ng-container>
