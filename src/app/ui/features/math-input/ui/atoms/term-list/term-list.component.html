@for (term of _termList.AsArray; track $index) {
  @if (IsExpression(term)) {
    @for (char of term.Characters; track $index) {
      <math-character #_charRef [Character]="char" (CharacterClick)="OnCharacterClick(_charRef.Character, _mathTermRef, $event.side)"
          MathTermView #_mathTermRef="MathTermViewRef" [Index]="$index"
      />
    }
  }
}
