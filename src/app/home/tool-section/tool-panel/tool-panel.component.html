<section>
  <div #text_container class="text-container">
    <div class="title">
      <ng-content select="h3"></ng-content>
    </div>
    <div class="description">
      <ng-content select="p"></ng-content>
    </div>
    <figure [ngStyle]="{'mask-image':maskUrl}"></figure>
  </div>
  <video #animation_video autoplay muted loop *ngIf="animationSrc" [src]="animationSrc"></video>


  <nav>
    <ng-content select="ul"></ng-content>
  </nav>
</section>
